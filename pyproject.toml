[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ciphersweet-py"
dynamic = ["version"]
description = "Searchable field-level encryption for Python, wire-compatible with paragonie/ciphersweet (PHP) and Laravel"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rizal Pahlevi" }]
requires-python = ">=3.10"
keywords = [
    "ciphersweet",
    "encryption",
    "searchable-encryption",
    "blind-index",
    "field-level-encryption",
    "laravel",
    "libsodium",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Database",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=41",
    "PyNaCl>=1.5",
]

[project.scripts]
ciphersweet = "ciphersweet.cli:main_entry"

[project.optional-dependencies]
go = ["argon2-cffi>=21.2"]
dev = [
    "argon2-cffi>=21.2",
    "build>=1.0",
    "mypy>=1.8",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/rizalpahlevii/ciphersweet-py"
Documentation = "https://ciphersweet-py.readthedocs.io"
Source = "https://github.com/rizalpahlevii/ciphersweet-py"
Issues = "https://github.com/rizalpahlevii/ciphersweet-py/issues"
Changelog = "https://github.com/rizalpahlevii/ciphersweet-py/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/ciphersweet/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ciphersweet"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP006", "UP007", "UP035", "UP045", "B904"]

[tool.mypy]
python_version = "3.10"
files = ["src/ciphersweet"]
ignore_missing_imports = true
warn_unused_ignores = false
