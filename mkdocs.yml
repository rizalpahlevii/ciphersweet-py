site_name: ciphersweet-py
site_description: Searchable field-level encryption for Python, wire-compatible with paragonie/ciphersweet (PHP) and Laravel.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, ""]
repo_url: https://github.com/rizalpahlevii/ciphersweet-py
repo_name: rizalpahlevii/ciphersweet-py
edit_uri: edit/main/docs/
copyright: MIT License
exclude_docs: |
  requirements.txt

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: sphinx
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            merge_init_into_class: true
            filters: ["!^_"]
            show_if_no_docstring: true
            inherited_members: false
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - User guide:
      - Compatibility with PHP: guide/compatibility.md
      - Backends: guide/backends.md
      - Key providers: guide/key-providers.md
      - Single fields: guide/encrypted-field.md
      - Rows and field types: guide/encrypted-row.md
      - Blind indexes: guide/blind-indexes.md
      - Additional authenticated data: guide/aad.md
      - Encrypted JSON: guide/json.md
      - Several tables at once: guide/multi-rows.md
      - Multi-tenancy: guide/multi-tenancy.md
      - Key rotation: guide/key-rotation.md
      - Laravel: guide/laravel.md
      - ciphersweet-go: guide/go.md
      - Database columns: guide/migrations.md
  - API reference:
      - Engine: reference/engine.md
      - Fields and rows: reference/fields.md
      - Blind indexes: reference/blind-indexes.md
      - Transformations: reference/transformations.md
      - AAD: reference/aad.md
      - Encrypted JSON: reference/json.md
      - Key providers: reference/key-providers.md
      - Backends: reference/backends.md
      - Key rotation: reference/key-rotation.md
      - Laravel helpers: reference/laravel.md
      - ciphersweet-go compat: reference/go.md
      - Migrations: reference/migrate.md
      - Exceptions: reference/exceptions.md
      - Constants: reference/constants.md
  - Changelog: changelog.md
